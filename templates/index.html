<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE COVEN 💀</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #000000;
            font-family: 'Georgia', serif;
        }

        #audio-start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 20px;
        }

        .start-btn {
            color: #8b0000;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            letter-spacing: 3px;
            text-transform: uppercase;
            border: 2px solid #8b0000;
            padding: 15px 25px;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.6);
            animation: pulse-start 2s infinite;
            text-align: center;
        }

        @keyframes pulse-start {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 40;
            background-image: url("{{ url_for('static', filename='coven_bg.jpg') }}");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #000000;
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .run-intro-fade {
            display: block !important;
            animation: skeletonFade 4.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes skeletonFade {
            0% { opacity: 0; transform: scale(1); }
            30% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.2); }
        }

        .bat-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            overflow: hidden;
            display: none;
        }

        .bat {
            position: absolute;
            fill: #080000;
            filter: drop-shadow(0 0 10px #ff0000);
        }

        .bat .wing {
            animation: flapWing 0.18s ease-in-out infinite alternate;
            transform-origin: center;
        }

        @keyframes flapWing {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(-0.5) translateY(-10px); }
        }

        #audioToggleBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 60;
            background: rgba(20, 0, 30, 0.85);
            border: 1px solid #ab47bc;
            color: #e1bee7;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(171, 71, 188, 0.5);
            outline: none;
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            padding: 20px;
        }

        .main-container::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 80px rgba(139, 0, 0, 0.4), inset 0 0 180px rgba(0, 0, 0, 0.95);
            pointer-events: none;
        }

        .main-visible {
            opacity: 1 !important;
        }

        .ui-container {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: auto;
        }

        .prompt {
            color: #ffffff;
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 0 15px #ff0000, 0 0 25px #8b0000;
        }

        form {
            width: 100%;
        }

        .input-group {
            position: relative;
            width: 100%;
            background: rgba(8, 2, 12, 0.95);
            border: 2px solid #6a1b9a;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            box-shadow: 0 0 20px rgba(106, 27, 154, 0.7);
        }

        .name-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            outline: none;
            text-align: center;
            font-family: inherit;
            min-width: 0;
        }

        .name-input::placeholder {
            color: #666;
        }

        .crystal-btn {
            background: none;
            border: none;
            color: #ab47bc;
            font-size: 1.4rem;
            cursor: pointer;
            margin-left: 6px;
            outline: none;
            padding: 5px;
        }

        .view-section {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .active-view {
            display: flex;
        }

        #result-box {
            margin-top: 15px;
            padding: 12px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            width: 100%;
            line-height: 1.4;
        }

        .outsider-denied {
            background-color: rgba(183, 28, 28, 0.95);
            border: 2px solid #ef5350;
            color: #ffcdd2;
        }

        .input-error {
            background-color: rgba(230, 81, 0, 0.95);
            border: 2px solid #ff9800;
            color: #ffe0b2;
        }

        .occult-btn {
            background: rgba(139, 0, 0, 0.85);
            color: #ffffff;
            border: 1px solid #ff0000;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            font-size: 0.9rem;
            width: 100%;
        }

        .menu-btn {
            background: rgba(80, 0, 120, 0.85);
            border: 1px solid #ab47bc;
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            font-size: 0.95rem;
        }

        .friend-card, .punishment-card {
            background: rgba(40, 0, 0, 0.95);
            border: 2px solid #ff5252;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            width: 100%;
        }

        .friend-card {
            background: rgba(20, 0, 30, 0.95);
            border: 2px solid #ab47bc;
        }

        .friend-name {
            color: #e1bee7;
            font-size: 1.1rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            word-break: break-word;
        }

        .friend-action {
            color: #ffffff;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .target-select {
            width: 100%;
            background: rgba(15, 5, 20, 0.95);
            border: 2px solid #ff5252;
            color: #ffffff;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            text-transform: uppercase;
            font-family: inherit;
            outline: none;
            margin-bottom: 12px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <div id="audio-start-overlay">
        <div class="start-btn">BEGIN THE RITUAL</div>
    </div>

    <div id="intro-overlay"></div>
    <div id="batContainer" class="bat-container"></div>

    <button id="audioToggleBtn" title="Toggle Sound">🔊</button>

    <div id="mainContainer" class="main-container">
        <div class="ui-container">

            <div id="inputView" class="view-section active-view">
                <div class="prompt">What is your name?</div>
                <form id="covenForm" onsubmit="return false;">
                    <div class="input-group">
                        <input type="text" id="nameInput" class="name-input" placeholder="TYPE YOUR NAME..." autocomplete="off">
                        <button type="button" id="submitNameBtn" class="crystal-btn">&#x2605;</button>
                    </div>
                </form>
                <div id="result-box" style="display: none;"></div>
            </div>

            <div id="successView" class="view-section">
                <div class="prompt" style="color: #4caf50; text-shadow: 0 0 15px #4caf50;">Access Granted</div>
                <div id="successMsg" style="color: #ffffff; font-size: 0.95rem; margin-bottom: 15px; line-height: 1.4; background: rgba(27, 94, 32, 0.9); border: 2px solid #4caf50; padding: 12px; border-radius: 6px; width: 100%; word-break: break-word;"></div>
                <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
                    <button id="goToMenuBtn" class="occult-btn menu-btn" style="margin: 0;">ENTER COVEN MENU 🦇</button>
                    <button id="tryAgainSuccessBtn" class="occult-btn">TRY AGAIN 🩸</button>
                </div>
            </div>

            <div id="menuView" class="view-section">
                <div class="prompt">Coven Sanctum Menu</div>
                <button id="friendsMenuBtn" class="occult-btn menu-btn">✨ Friends & Blessings</button>
                <button id="punishmentMenuBtn" class="occult-btn menu-btn" style="border-color: #ff5252; background: rgba(183, 28, 28, 0.7);">🔥 Tribunal of Punishment</button>
                <button id="menuQuitBtn" class="occult-btn menu-btn" style="border-color: #ff0000; background: rgba(139, 0, 0, 0.6);">Quit to Portal</button>
            </div>

            <div id="friendView" class="view-section">
                <div class="prompt">Spirit Guidance</div>
                <div class="friend-card">
                    <div style="font-size: 0.8rem; color: #b39ddb; margin-bottom: 4px; text-transform: uppercase;">Suggested Coven Member:</div>
                    <div id="friendNameDisplay" class="friend-name">---</div>
                    <div id="friendActionDisplay" class="friend-action">---</div>
                </div>
                <button id="anotherFriendBtn" class="occult-btn menu-btn">🔮 Pick Another Friend</button>
                <button id="friendQuitBtn" class="occult-btn menu-btn" style="background: rgba(139, 0, 0, 0.6);">Quit to Menu</button>
            </div>

            <div id="punishmentView" class="view-section">
                <div class="prompt" style="color: #ff5252; text-shadow: 0 0 15px #ff5252; font-size: 1.1rem;">Tribunal of Punishment</div>
                
                <div style="width: 100%; text-align: left; margin-bottom: 4px; color: #ff8a80; font-size: 0.8rem; text-transform: uppercase;">Select Target Member:</div>
                <select id="targetSelect" class="target-select">
                    <option value="SHALOM">SHALOM</option>
                    <option value="TIMOTHY">TIMOTHY</option>
                    <option value="WILSON">WILSON</option>
                    <option value="MALIK">MALIK</option>
                    <option value="NIFEMI">NIFEMI</option>
                </select>

                <div id="captureCard" class="punishment-card">
                    <div style="font-size: 0.8rem; color: #ff8a80; margin-bottom: 6px; text-transform: uppercase;">Queen Mother's Decree:</div>
                    <div id="punishmentDisplay" class="friend-action" style="font-size: 0.9rem; color: #ffcdd2;">---</div>
                </div>

                <button id="executePunishmentBtn" class="occult-btn menu-btn" style="background: rgba(183, 28, 28, 0.9); border-color: #ff5252;">⚖️ Issue Royal Decree & Trial</button>
                <button id="saveImageBtn" class="occult-btn menu-btn" style="background: rgba(46, 125, 50, 0.9); border-color: #81c784;">📸 Save Decree as Image</button>
                <button id="punishmentQuitBtn" class="occult-btn menu-btn" style="background: rgba(139, 0, 0, 0.6);">Quit to Menu</button>
            </div>

        </div>
    </div>

    <script>
        const startOverlay = document.getElementById('audio-start-overlay');
        const introOverlay = document.getElementById('intro-overlay');
        const batContainer = document.getElementById('batContainer');
        const mainContainer = document.getElementById('mainContainer');
        const audioToggleBtn = document.getElementById('audioToggleBtn');
        
        const inputView = document.getElementById('inputView');
        const successView = document.getElementById('successView');
        const menuView = document.getElementById('menuView');
        const friendView = document.getElementById('friendView');
        const punishmentView = document.getElementById('punishmentView');

        const covenForm = document.getElementById('covenForm');
        const nameInput = document.getElementById('nameInput');
        const submitNameBtn = document.getElementById('submitNameBtn');
        const resultBox = document.getElementById('result-box');
        const successMsg = document.getElementById('successMsg');

        const goToMenuBtn = document.getElementById('goToMenuBtn');
        const tryAgainSuccessBtn = document.getElementById('tryAgainSuccessBtn');
        const friendsMenuBtn = document.getElementById('friendsMenuBtn');
        const punishmentMenuBtn = document.getElementById('punishmentMenuBtn');
        const menuQuitBtn = document.getElementById('menuQuitBtn');

        const friendNameDisplay = document.getElementById('friendNameDisplay');
        const friendActionDisplay = document.getElementById('friendActionDisplay');
        const anotherFriendBtn = document.getElementById('anotherFriendBtn');
        const friendQuitBtn = document.getElementById('friendQuitBtn');

        const targetSelect = document.getElementById('targetSelect');
        const punishmentDisplay = document.getElementById('punishmentDisplay');
        const executePunishmentBtn = document.getElementById('executePunishmentBtn');
        const saveImageBtn = document.getElementById('saveImageBtn');
        const punishmentQuitBtn = document.getElementById('punishmentQuitBtn');
        const captureCard = document.getElementById('captureCard');

        let customAudio = null;
        let secondAudio = null;

        function switchView(targetView) {
            [inputView, successView, menuView, friendView, punishmentView].forEach(v => v.classList.remove('active-view'));
            targetView.classList.add('active-view');
        }

        function initSpookyAudio() {
            try {
                if (!customAudio) {
                    customAudio = new Audio("{{ url_for('static', filename='ambient.mp3') }}");
                    customAudio.loop = true;
                    customAudio.volume = 0.7;
                }
                if (!secondAudio) {
                    secondAudio = new Audio("{{ url_for('static', filename='static.mp3') }}");
                    secondAudio.loop = true;
                    secondAudio.volume = 0.5;
                }
                Promise.all([
                    customAudio.play(),
                    secondAudio.play()
                ]).then(() => {
                    audioToggleBtn.innerText = '🔊';
                    audioToggleBtn.style.display = 'flex';
                }).catch(err => {
                    audioToggleBtn.innerText = '🔇';
                    audioToggleBtn.style.display = 'flex';
                });
            } catch (e) {}
        }

        audioToggleBtn.addEventListener('click', function() {
            if (!customAudio || !secondAudio) return;
            if (customAudio.paused) {
                customAudio.play();
                secondAudio.play();
                audioToggleBtn.innerText = '🔊';
            } else {
                customAudio.pause();
                secondAudio.pause();
                audioToggleBtn.innerText = '🔇';
            }
        });

        startOverlay.addEventListener('click', function() {
            initSpookyAudio();
            startOverlay.style.display = 'none';
            introOverlay.classList.add('run-intro-fade');

            setTimeout(() => {
                batContainer.style.display = 'block';
                mainContainer.classList.add('main-visible');
                startRandomBatSpawner();
            }, 4500);
        });

        function spawnSingleBat() {
            const bat = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            bat.setAttribute("class", "bat");
            bat.setAttribute("viewBox", "0 0 100 60");
            const width = Math.floor(Math.random() * 120) + 90;
            const height = Math.floor(width * 0.6);
            bat.style.width = width + "px";
            bat.style.height = height + "px";
            bat.innerHTML = `
                <path class="wing" d="M50 35 Q30 10 5 25 Q20 40 35 35 Q45 45 50 35 Z" />
                <path class="wing" d="M50 35 Q70 10 95 25 Q80 40 65 35 Q55 45 50 35 Z" />
                <circle cx="50" cy="33" r="5" />
            `;
            const startFromLeft = Math.random() > 0.5;
            const startX = startFromLeft ? -150 : window.innerWidth + 150;
            const endX = startFromLeft ? window.innerWidth + 150 : -150;
            const startY = Math.random() * (window.innerHeight * 0.85);
            const endY = Math.random() * (window.innerHeight * 0.85);
            const randomCurve = (Math.random() - 0.5) * 200;
            const duration = Math.random() * 4 + 3;

            bat.style.left = `${startX}px`;
            bat.style.top = `${startY}px`;
            batContainer.appendChild(bat);

            const animation = bat.animate([
                { transform: `translate(0, 0) scale(${startFromLeft ? 1 : -1}, 1)` },
                { transform: `translate(${(endX - startX) * 0.5}px, ${endY - startY + randomCurve}px) scale(${startFromLeft ? 1.2 : -1.2}, 1.2)` },
                { transform: `translate(${endX - startX}px, ${endY - startY}px) scale(${startFromLeft ? 0.9 : -0.9}, 0.9)` }
            ], {
                duration: duration * 1000,
                easing: 'cubic-bezier(0.4, 0, 0.6, 1)'
            });
            animation.onfinish = () => bat.remove();
        }

        function startRandomBatSpawner() {
            for (let i = 0; i < 3; i++) {
                setTimeout(spawnSingleBat, i * 600);
            }
            setInterval(spawnSingleBat, Math.random() * 2000 + 1500);
        }

        async function handleNameSubmission() {
            const enteredName = nameInput.value.trim();
            if (!enteredName) return;

            try {
                const response = await fetch('/check-coven', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: enteredName })
                });
                const data = await response.json();

                if (data.status === 'coven') {
                    successMsg.innerText = data.message;
                    switchView(successView);
                } else if (data.status === 'outsider') {
                    resultBox.className = '';
                    resultBox.style.display = 'block';
                    resultBox.classList.add('outsider-denied');
                    resultBox.innerText = data.message;
                    mainContainer.style.animation = 'shake 0.4s';
                    setTimeout(() => { mainContainer.style.animation = 'none'; }, 400);
                } else {
                    resultBox.className = '';
                    resultBox.style.display = 'block';
                    resultBox.classList.add('input-error');
                    resultBox.innerText = data.message;
                }
            } catch (err) {
                console.error("Submission failed:", err);
            }
        }

        submitNameBtn.addEventListener('click', handleNameSubmission);
        nameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleNameSubmission();
            }
        });

        tryAgainSuccessBtn.addEventListener('click', function() {
            nameInput.value = '';
            resultBox.style.display = 'none';
            switchView(inputView);
        });

        goToMenuBtn.addEventListener('click', function() {
            switchView(menuView);
        });

        menuQuitBtn.addEventListener('click', function() {
            nameInput.value = '';
            resultBox.style.display = 'none';
            switchView(inputView);
        });

        async function loadFriendData() {
            try {
                const res = await fetch('/coven-friend');
                const data = await res.json();
                friendNameDisplay.innerText = data.friend;
                friendActionDisplay.innerText = data.action;
            } catch (err) {}
        }

        async function loadPunishmentData() {
            try {
                const chosenTarget = targetSelect.value;
                const res = await fetch('/coven-punishment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: chosenTarget })
                });
                const data = await res.json();
                punishmentDisplay.innerText = data.punishment;
            } catch (err) {}
        }

        friendsMenuBtn.addEventListener('click', function() {
            loadFriendData();
            switchView(friendView);
        });

        punishmentMenuBtn.addEventListener('click', function() {
            loadPunishmentData();
            switchView(punishmentView);
        });

        anotherFriendBtn.addEventListener('click', function() {
            loadFriendData();
        });

        friendQuitBtn.addEventListener('click', function() {
            switchView(menuView);
        });

        executePunishmentBtn.addEventListener('click', function() {
            loadPunishmentData();
        });

        saveImageBtn.addEventListener('click', function() {
            saveImageBtn.innerText = "CAPTURING...";
            html2canvas(captureCard, {
                backgroundColor: '#000000',
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'coven-decree.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                saveImageBtn.innerText = "📸 Save Decree as Image";
            }).catch(err => {
                saveImageBtn.innerText = "📸 Save Decree as Image";
            });
        });

        punishmentQuitBtn.addEventListener('click', function() {
            switchView(menuView);
        });
    </script>
</body>
</html>
